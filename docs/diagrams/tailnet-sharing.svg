<text x="998" y="772" class="small">macOS Remote Login</text>
<text x="938" y="822" class="tiny">key auth · known host</text>

<!-- Paseo terminal (owned share) -->
<rect x="1250" y="470" width="255" height="180" rx="16" fill="#fff" stroke="#c9c2ef" stroke-width="2"/>
<g class="new"><rect x="1424" y="458" width="66" height="26" rx="13"/><text x="1457" y="476" text-anchor="middle">NEW</text></g>
<use href="#terminal" x="1264" y="488" width="44" height="44" class="icon"/>
<text x="1316" y="512" class="label2">Paseo terminal</text>
<text x="1316" y="534" class="tiny">owned share · foreground</text>
<text x="1266" y="572" class="mono" style="font-size:14.5px">tailscale serve</text>
<text x="1266" y="594" class="mono" style="font-size:14.5px">  --https=56230</text>
<text x="1266" y="616" class="mono" style="font-size:14.5px">  http://127.0.0.1:56230</text>
<text x="1266" y="640" class="tiny">share ends with terminal*</text>

<!-- App -->
<rect x="1545" y="255" width="180" height="600" rx="16" fill="#fff" stroke="#bddccc" stroke-width="2"/>
