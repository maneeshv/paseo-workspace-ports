<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#1c3048}
 .title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#5e7085}
 .label{font-size:24px;font-weight:700}.label2{font-size:21px;font-weight:700}
 .body{font-size:20px}.small{font-size:17px;fill:#5e7085}.tiny{font-size:15px;fill:#5e7085}
 .mono{font-family:Menlo,Consolas,monospace;font-size:16px;fill:#1c3048}
 .cap{font-size:16px;font-weight:700;letter-spacing:1.6px;fill:#536b85}
 .icon{fill:none;stroke:#355573;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 .icon-teal{fill:none;stroke:#087f8c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 .icon-muted{fill:none;stroke:#8a99aa;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 .route{fill:none;stroke:#087f8c;stroke-width:5;marker-end:url(#m-teal)}
 .legacy{fill:none;stroke:#8a99aa;stroke-width:3.5;marker-end:url(#m-grey)}
 .ctrl{fill:none;stroke:#6a5bd6;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#m-ctrl)}
 .blocked{fill:none;stroke:#c2413b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#m-red)}
 .new rect{fill:#087f8c}.new text{font-size:13px;font-weight:700;letter-spacing:1px;fill:#fff}
 .same rect{fill:#e3e8ee}.same text{font-size:13px;font-weight:700;letter-spacing:1px;fill:#5e7085}
</style>

<rect width="1800" height="1230" fill="#f8fafc"/>

<!-- Header -->
<text x="60" y="72" class="title">Share to tailnet: open workspace apps from your phone</text>
<text x="60" y="110" class="sub">Proposed for Workspace Ports 0.2.0 · Tailscale Serve on the workspace Mac · no SSH keys on the phone</text>
<rect x="1400" y="40" width="340" height="50" rx="25" fill="#dff3e9"/>
<text x="1570" y="73" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#21664d">TAILNET ONLY · NOT PUBLIC</text>

<!-- Column captions -->
<text x="60" y="172" class="cap">CLIENT DEVICES</text>
<text x="520" y="172" class="cap">NETWORK PATHS</text>

<!-- ============ Phone (new) ============ -->
<rect x="60" y="190" width="420" height="450" rx="22" fill="#edf3fc" stroke="#bed0e8"/>
<g class="new"><rect x="396" y="178" width="66" height="26" rx="13"/><text x="429" y="196" text-anchor="middle">NEW</text></g>
<use href="#phone" x="78" y="206" width="58" height="58" class="icon"/>
<text x="146" y="236" class="label">Phone</text>
<text x="146" y="262" class="small">Paseo app + Tailscale app · tailnet member</text>

<rect x="85" y="292" width="370" height="140" rx="16" fill="#fff" stroke="#cdd8e5"/>
<use href="#browser" x="103" y="310" width="50" height="50" class="icon"/>
<text x="166" y="333" class="label2">System browser</text>
<text x="166" y="358" class="small">Safari or default browser</text>
<text x="105" y="410" class="mono">https://work.example.ts.net:56230</text>

<rect x="85" y="475" width="370" height="145" rx="16" fill="#fff" stroke="#cdd8e5"/>
<use href="#panel" x="103" y="492" width="50" height="50" class="icon"/>
<text x="166" y="515" class="label2">Paseo app · Ports panel</text>
<text x="166" y="540" class="small">Drives agents remotely</text>
<rect x="105" y="562" width="150" height="40" rx="8" fill="#2f7a52"/>
<text x="180" y="588" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#fff">Share &amp; Open</text>
<text x="270" y="580" class="tiny">Copy link</text>
<text x="270" y="600" class="tiny">Stop sharing</text>
<!-- openExternalUrl hop -->
<path d="M300 475 V440" class="ctrl"/>
<text x="312" y="462" class="mono" style="font-size:14px;fill:#6a5bd6">openExternalUrl</text>

<!-- ============ Viewing Mac (existing) ============ -->
<rect x="60" y="690" width="420" height="190" rx="22" fill="#f1f4f7" stroke="#d6dfe8"/>
<g class="same"><rect x="352" y="678" width="110" height="26" rx="13"/><text x="407" y="696" text-anchor="middle">UNCHANGED</text></g>
<use href="#laptop" x="78" y="706" width="58" height="58" class="icon-muted"/>
<text x="146" y="736" class="label" style="fill:#5e7085">Viewing Mac</text>
<text x="146" y="762" class="small">Paseo desktop</text>
<text x="85" y="812" class="small">Paseo browser → 127.0.0.1:&lt;local port&gt;</text>
<text x="85" y="842" class="small">SSH tunnel terminal in tunnel workspace</text>

<!-- ============ Network bands ============ -->
<rect x="520" y="250" width="340" height="180" rx="18" fill="#eaf6f5" stroke="#70b6b8" stroke-dasharray="6 5"/>
<text x="540" y="278" class="cap" style="fill:#087f8c">YOUR TAILNET</text>
<use href="#lock" x="670" y="282" width="40" height="40" class="icon-teal"/>
<text x="690" y="348" text-anchor="middle" class="label2" style="fill:#087f8c">HTTPS · TCP 56230</text>
<text x="690" y="400" text-anchor="middle" class="small">WireGuard · devices your ACLs allow</text>

<rect x="520" y="470" width="340" height="160" rx="18" fill="#f1effb" stroke="#c9c2ef" stroke-dasharray="6 5"/>
<text x="540" y="498" class="cap" style="fill:#6a5bd6">PASEO CONNECTION</text>
<text x="690" y="535" text-anchor="middle" class="mono" style="font-size:17px;fill:#6a5bd6">share.start · list · stop</text>
<text x="690" y="590" text-anchor="middle" class="small">existing link · relay or direct</text>
<text x="690" y="612" text-anchor="middle" class="tiny">3 new RPCs</text>

<rect x="520" y="700" width="340" height="170" rx="18" fill="#f4f6f8" stroke="#d6dfe8" stroke-dasharray="6 5"/>
<text x="540" y="728" class="cap">SSH NETWORK</text>
