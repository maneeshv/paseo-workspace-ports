<text x="938" y="360" class="mono" style="font-size:15px">HTTPS :56230</text>
<text x="938" y="384" class="tiny">TLS terminates here</text>

<!-- Paseo daemon + plugin -->
<rect x="920" y="470" width="270" height="165" rx="16" fill="#fff" stroke="#c9c2ef" stroke-width="2"/>
<g class="new"><rect x="1108" y="458" width="66" height="26" rx="13"/><text x="1141" y="476" text-anchor="middle">NEW</text></g>
<use href="#server" x="936" y="488" width="50" height="50" class="icon"/>
<text x="998" y="512" class="label2">Paseo daemon</text>
<text x="998" y="536" class="small">Workspace Ports plugin</text>
<text x="938" y="578" class="mono" style="font-size:15px">share.* handlers</text>
<text x="938" y="602" class="tiny">app must be in this</text>
<text x="938" y="621" class="tiny">workspace's app list</text>

<!-- sshd (existing) -->
<rect x="920" y="705" width="270" height="150" rx="16" fill="#f7f9fa" stroke="#d6dfe8"/>
<g class="same"><rect x="1062" y="693" width="110" height="26" rx="13"/><text x="1117" y="711" text-anchor="middle">UNCHANGED</text></g>
<use href="#server" x="936" y="722" width="50" height="50" class="icon-muted"/>
