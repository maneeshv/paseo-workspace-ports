<text x="1290" y="380" text-anchor="middle" class="tiny" style="fill:#6a5bd6">registers mapping</text>
<path d="M1000 470 V419" class="ctrl"/>
<text x="1010" y="448" class="mono" style="font-size:13.5px;fill:#6a5bd6">status --json</text>

<!-- ============ Legend ============ -->
<rect x="60" y="915" width="660" height="280" rx="18" fill="#fff" stroke="#cdd8e5"/>
<text x="85" y="950" class="cap">LEGEND</text>
<path d="M85 985 H165" class="route"/><text x="185" y="991" class="body">App traffic over tailnet (new)</text>
<path d="M85 1027 H165" class="legacy"/><text x="185" y="1033" class="body">App traffic over SSH tunnel (unchanged)</text>
<path d="M85 1069 H165" class="ctrl"/><text x="185" y="1075" class="body">Control: Paseo RPC and local commands</text>
<path d="M85 1111 H165" class="blocked"/>
<circle cx="125" cy="1111" r="10" fill="#fff" stroke="#c2413b" stroke-width="2"/><path d="M120 1106 l10 10 m0 -10 l-10 10" stroke="#c2413b" stroke-width="2"/>
<text x="185" y="1117" class="body">Not allowed: public route</text>
<g class="new"><rect x="85" y="1145" width="66" height="26" rx="13"/><text x="118" y="1163" text-anchor="middle">NEW</text></g>
<text x="162" y="1164" class="body">Added by this change</text>
<g class="same"><rect x="400" y="1145" width="110" height="26" rx="13"/><text x="455" y="1163" text-anchor="middle">UNCHANGED</text></g>
<text x="522" y="1164" class="body">Existing</text>

<!-- ============ Lifecycle ============ -->
<rect x="750" y="915" width="990" height="280" rx="18" fill="#fff" stroke="#cdd8e5"/>
<text x="775" y="950" class="cap">SHARE LIFECYCLE · ONE OWNED PASEO TERMINAL PER SHARE</text>

<rect x="775" y="972" width="270" height="48" rx="12" fill="#eaf6f5" stroke="#70b6b8"/>
<text x="910" y="1003" text-anchor="middle" class="body">① Share &amp; Open</text>
<path d="M1050 996 H1090" class="ctrl"/>
<rect x="1095" y="972" width="270" height="48" rx="12" fill="#eaf6f5" stroke="#70b6b8"/>
<text x="1230" y="1003" text-anchor="middle" class="body">② Terminal created</text>
<path d="M1370 996 H1410" class="ctrl"/>
<rect x="1415" y="972" width="300" height="48" rx="12" fill="#eaf6f5" stroke="#70b6b8"/>
<text x="1565" y="1003" text-anchor="middle" class="body">③ Serve running · link opens</text>

<rect x="775" y="1036" width="270" height="48" rx="12" fill="#f4f6f8" stroke="#d6dfe8"/>
<text x="910" y="1067" text-anchor="middle" class="body">④ Stop sharing</text>
<path d="M1050 1060 H1090" class="ctrl"/>
<rect x="1095" y="1036" width="270" height="48" rx="12" fill="#f4f6f8" stroke="#d6dfe8"/>
<text x="1230" y="1067" text-anchor="middle" class="body">⑤ Terminal killed</text>
<path d="M1370 1060 H1410" class="ctrl"/>
<rect x="1415" y="1036" width="300" height="48" rx="12" fill="#f4f6f8" stroke="#d6dfe8"/>
<text x="1565" y="1067" text-anchor="middle" class="body">⑥ Mapping removed*</text>

<text x="775" y="1118" class="small">Stopping a share never stops the app. Stopping the app never removes the share.</text>
<text x="775" y="1146" class="small">Ownership = exact terminal name in the workspace. Never serve reset, --bg, or Funnel.</text>
<text x="775" y="1174" class="small" style="fill:#a5641a">* Removal on process exit is unverified: Phase 0 check V1 in docs/specs/tailnet-sharing.md.</text>
